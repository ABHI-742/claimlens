name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: claimlens
          POSTGRES_PASSWORD: claimlens
          POSTGRES_DB: claimlens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U claimlens" --health-interval 5s --health-retries 10
      localstack:
        image: localstack/localstack:3.8
        env:
          SERVICES: s3,sqs
        ports: ["4566:4566"]
    env:
      TEST_DATABASE_URL: postgresql+psycopg://claimlens:claimlens@localhost:5432/claimlens_test
      LOCALSTACK_URL: http://localhost:4566
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Wait for LocalStack
        run: timeout 60 bash -c 'until curl -sf http://localhost:4566/_localstack/health; do sleep 2; done'
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
