services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: claimlens
      POSTGRES_PASSWORD: claimlens
      POSTGRES_DB: claimlens
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimlens"]
      interval: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3,sqs
    ports: ["4566:4566"]
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://claimlens:claimlens@postgres:5432/claimlens
      AWS_ENDPOINT_URL: http://localstack:4566
      CLAIMS_QUEUE_URL: http://localstack:4566/000000000000/claim-jobs
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_started }

  worker:
    build: ./backend
    command: ["python", "-m", "app.workers.claim_worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://claimlens:claimlens@postgres:5432/claimlens
      AWS_ENDPOINT_URL: http://localstack:4566
      CLAIMS_QUEUE_URL: http://localstack:4566/000000000000/claim-jobs
    depends_on: [api]

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes: ["./frontend:/app"]
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  pgdata:
